[theme]
base = "light"
primaryColor = "#1F7A70"
backgroundColor = "#FFFFFF"
secondaryBackgroundColor = "#F5F7FA"
textColor = "#14213D"
font = "sans serif"

[client]
toolbarMode = "minimal"
showErrorDetails = "none"

[server]
headless = true
fileWatcherType = "none"
runOnSave = false

[browser]
gatherUsageStats = false
